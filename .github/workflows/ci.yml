name: PHP Composer Auto-Fix Lock

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true  # penting untuk bisa push balik

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check PHP & Composer
        run: |
          php -v
          composer -V

      - name: Validate composer.json
        id: validate
        continue-on-error: true
        run: composer validate --strict

      - name: Auto-fix composer.lock if needed
        if: steps.validate.outcome == 'failure'
        run: |
          echo "composer.lock out of date, fixing..."
          composer update --lock
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "chore: auto-update composer.lock [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}
